<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Viemaq — EXPOINTER | Territórios</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --yellow:#F5C400;
  --black:#111111;
  --white:#FFFFFF;
  --border:#EBEBEB;
  --text-muted:#999999;
  --filippe:#1B4F72;
  --filippe-bg:#EBF4FB;
  --filial-rs:#7B241C;
  --filial-rs-bg:#FCECEA;
  --saulo:#5B2C6F;
  --saulo-bg:#F5EEF8;
  --matriz:#1A5276;
  --matriz-bg:#EBF5FB;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--white);
  font-family: 'DM Sans', sans-serif;
  color: var(--black);
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT: header fixo + conteúdo centralizado ── */
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  height: 100vh;
}

/* HEADER */
header {
  flex-shrink: 0;
  background: var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1rem;
  height: 56px;
  border-bottom: 2.5px solid var(--yellow);
}
#logo {
  height: 34px;
  width: auto;
  display: block;
}

/* HERO STRIP */
.hero-strip {
  flex-shrink: 0;
  background: var(--black);
  text-align: center;
  padding: 10px 1rem 14px;
  position: relative;
}
.hero-strip::after {
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:3px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 16px,transparent 16px 22px);
}
.hero-strip h1 {
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--yellow);
  letter-spacing: 2px;
  line-height: 1;
  margin-bottom: 2px;
}
.hero-strip p {
  font-size: 0.72rem;
  color: #AAA;
  letter-spacing: 0.5px;
}

/* MAIN CONTENT */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px 16px 12px;
  overflow: hidden;
  gap: 12px;
}

/* SEARCH */
.search-wrap {
  position: relative;
  flex-shrink: 0;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: #BCBAB3;
  pointer-events: none;
}
#search {
  width: 100%;
  padding: 13px 12px 13px 38px;
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 500;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--white);
  outline: none;
  color: var(--black);
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
}
#search:focus {
  border-color: var(--yellow);
  box-shadow: 0 0 0 3px rgba(245,196,0,0.15);
}
#search::placeholder { color:#BCBAB3; font-weight:400; }

/* SUGGESTIONS */
#suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 200;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.10);
}
.sug-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
  transition: background .1s;
}
.sug-item:last-child { border-bottom: none; }
.sug-item:active { background: #F9F9F9; }
.sug-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  white-space: nowrap;
  margin-left: 8px;
}

/* RESULT CARD */
#result { display: none; flex-shrink: 0; }

.result-card {
  border-radius: 16px;
  overflow: hidden;
  border: 1.5px solid var(--border);
  animation: popIn .2s ease;
}
@keyframes popIn {
  from { opacity:0; transform:scale(.97) translateY(6px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}

.rc-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
}
.rc-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.rc-label {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.6;
  margin-bottom: 2px;
}
.rc-team {
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1.2;
}
.rc-bottom {
  display: flex;
  border-top: 1.5px solid var(--border);
}
.rc-field {
  flex: 1;
  padding: 10px 16px;
  border-right: 1px solid var(--border);
}
.rc-field:last-child { border-right: none; }
.rc-field .lbl {
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  opacity: 0.5;
  margin-bottom: 2px;
}
.rc-field .val {
  font-size: 0.9rem;
  font-weight: 600;
}

/* NOT FOUND */
#not-found {
  display: none;
  flex-shrink: 0;
  text-align: center;
  padding: 20px 0;
}
#not-found .nf-emoji { font-size: 2rem; margin-bottom: 8px; }
#not-found h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
#not-found p { font-size: 0.82rem; color: var(--text-muted); }

/* TEAM PILLS (bottom) */
.team-pills {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: auto;
}
.pill {
  border-radius: 10px;
  border: 1.5px solid var(--border);
  padding: 10px 10px;
  cursor: pointer;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform .1s;
  background: var(--white);
}
.pill:active { transform: scale(.97); }
.pill .p-name {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.pill .p-state {
  font-size: 0.62rem;
  color: var(--text-muted);
  margin-top: 1px;
}

footer {
  flex-shrink: 0;
  text-align: center;
  padding: 6px;
  font-size: 0.62rem;
  color: #CCC;
  background: var(--white);
  border-top: 1px solid var(--border);
}

/* Desktop: centraliza num card */
@media(min-width:600px){
  body { background:#F5F5F5; overflow:auto; }
  html { overflow:auto; height:auto; }
  .app {
    height:auto;
    min-height:100vh;
    max-width:420px;
    margin:0 auto;
    background:var(--white);
    box-shadow:0 0 40px rgba(0,0,0,.1);
  }
  .content { overflow:visible; }
}
</style>

const TEAM_CONFIG = {
  "Subdealer Filippe Peças":  {color:"#1B4F72",bg:"#D6EAF8",dot:"#2E86C1"},
  "Filial Rio Grande do Sul": {color:"#7B241C",bg:"#FADBD8",dot:"#C0392B"},
  "Consultor Saulo":          {color:"#6C3483",bg:"#E8DAEF",dot:"#8E44AD"},
  "Time Interno Matriz":      {color:"#784212",bg:"#FDEBD0",dot:"#CA6F1E"},
};
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,'');}
const searchEl=document.getElementById('search');
const suggestEl=document.getElementById('suggestions');
const resultEl=document.getElementById('result');
const notFoundEl=document.getElementById('not-found');
let activeIdx=-1;
function filterTeam(team){searchEl.value=team.replace('Subdealer ','').replace('Filial ','');searchEl.focus();handleInput();}
function showResult(entry){
  document.querySelector('.team-pills').style.display='none';
  const cfg=TEAM_CONFIG[entry.team];
  const stateNames={RS:"Rio Grande do Sul",SC:"Santa Catarina",SP:"São Paulo",MG:"Minas Gerais",PR:"Paraná",RJ:"Rio de Janeiro",BA:"Bahia",GO:"Goiás",PE:"Pernambuco",CE:"Ceará",PA:"Pará",MA:"Maranhão",AM:"Amazonas",MT:"Mato Grosso",MS:"Mato Grosso do Sul",ES:"Espírito Santo",PB:"Paraíba",RN:"Rio Grande do Norte",AL:"Alagoas",PI:"Piauí",SE:"Sergipe",RO:"Rondônia",TO:"Tocantins",AC:"Acre",AP:"Amapá",RR:"Roraima",DF:"Distrito Federal"};
  const stateFull=stateNames[entry.state]||entry.state;
  resultEl.style.display='block';
  notFoundEl.style.display='none';
  resultEl.innerHTML=`<div class="result-card"><div class="rc-top" style="background:${cfg.bg}"><div class="rc-icon" style="background:${cfg.color}">📍</div><div><div class="rc-label" style="color:${cfg.color}">Equipe Responsável</div><div class="rc-team" style="color:${cfg.color}">${entry.team}</div></div></div><div class="rc-bottom"><div class="rc-field"><div class="lbl">Cidade</div><div class="val">${entry.city}</div></div><div class="rc-field"><div class="lbl">Estado</div><div class="val">${stateFull}</div></div></div></div>`;
}
function buildSuggestions(matches){
  suggestEl.innerHTML='';
  if(!matches.length){suggestEl.style.display='none';return;}
  matches.slice(0,8).forEach(entry=>{
    const cfg=TEAM_CONFIG[entry.team];
    const div=document.createElement('div');div.className='sug-item';
    div.innerHTML=`<span>${entry.city} – ${entry.state}</span><span class="sug-badge" style="background:${cfg.bg};color:${cfg.color}">${entry.team.replace('Subdealer ','').replace('Filial ','')}</span>`;
    div.addEventListener('mousedown',e=>{e.preventDefault();selectEntry(entry);});
    suggestEl.appendChild(div);
  });
  suggestEl.style.display='block';activeIdx=-1;
}
function selectEntry(entry){searchEl.value=entry.city;suggestEl.style.display='none';showResult(entry);}
function handleInput(){
  const val=searchEl.value.trim();resultEl.style.display='none';notFoundEl.style.display='none';
  if(!val){suggestEl.style.display='none';resultEl.style.display='none';document.getElementById('not-found').style.display='none';document.querySelector('.team-pills').style.display='grid';return;}
  const q=normalize(val);
  const matches=DATA.filter(e=>normalize(e.city).includes(q)||normalize(e.team).includes(q));
  buildSuggestions(matches);
}
searchEl.addEventListener('input',handleInput);
searchEl.addEventListener('keydown',e=>{
  const items=suggestEl.querySelectorAll('.suggestion-item');
  if(e.key==='ArrowDown'){e.preventDefault();activeIdx=Math.min(activeIdx+1,items.length-1);items.forEach((el,i)=>el.style.background=i===activeIdx?'#F9F9F9':'');}
  else if(e.key==='ArrowUp'){e.preventDefault();activeIdx=Math.max(activeIdx-1,-1);items.forEach((el,i)=>el.style.background=i===activeIdx?'#F9F9F9':'');}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(activeIdx>=0&&items[activeIdx]){items[activeIdx].dispatchEvent(new MouseEvent('mousedown'));}
    else{const q=normalize(searchEl.value.trim());const exact=DATA.find(e=>normalize(e.city)===q);const partial=DATA.filter(e=>normalize(e.city).startsWith(q));
      if(exact)selectEntry(exact);else if(partial.length===1)selectEntry(partial[0]);else if(!partial.length){suggestEl.style.display='none';notFoundEl.style.display='block';resultEl.style.display='none';document.querySelector('.team-pills').style.display='none';}}
  }else if(e.key==='Escape'){suggestEl.style.display='none';}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))suggestEl.style.display='none';});
</script>
